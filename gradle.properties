#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# --- Fork identity -------------------------------------------------------
# Single source of truth for this fork's branding. Change these four values to
# rebrand; nothing else needs editing. They feed both the desktop packaging
# (installer name, vendor, macOS bundle) and the generated ForkBranding object
# that the UI reads.
#
# fork.appName is currently a PLACEHOLDER -- pick the real name and change it
# here.
#
# Deliberately NOT derived from these values:
#   - the Kotlin package (com.nuvio.app). Renaming it would rewrite every source
#     file and conflict on every upstream merge, and no user ever sees it.
#   - the desktop data directory (~/Library/Application Support/Nuvio). Changing
#     it would orphan the library, settings and watch history of any existing
#     install.
fork.appName=Clipper
fork.vendor=Clipper
fork.bundleId=com.clipper.media.desktop
fork.urlScheme=clipper
