name: Desktop feature request
description: Suggest a desktop app improvement or new feature.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue, please. The more real-world your use case is, the easier it is to judge.

        StreamCut is a personal alpha fork built around clipping, so requests get weighed against what the author actually wants the app to be — see [CONTRIBUTING.md](https://github.com/julianbou/streamcut/blob/main/CONTRIBUTING.md). Filing one is welcome; an answer isn't guaranteed.

        If you're planning to build it yourself, say so here first — it's cheaper than finding out afterwards that it doesn't fit.

  - type: dropdown
    id: area
    attributes:
      label: Area (tag)
      options:
        - Playback
        - Streams / Sources
        - Next Episode / Auto-play
        - Watch Progress
        - Subtitles
        - Audio
        - Windowing / Fullscreen
        - Keyboard / Mouse input
        - Navigation
        - UI / Layout
        - Settings
        - Sync (Trakt / remote)
        - Downloads / Offline
        - Installer / Updater
        - Platform-specific (Windows / macOS / Linux)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: dropdown
    id: contribution_plan
    attributes:
      label: Are you planning to implement this yourself?
      description: Major features are usually implemented in-house unless approved first.
      options:
        - No, this is only a proposal
        - Maybe, but only if approved first
        - Yes, but I understand implementation still needs maintainer approval
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Mockups, examples from other apps, etc.
    validations:
      required: false
